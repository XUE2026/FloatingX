name: Build FloatingX APK

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1800

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create artifact directory
        run: |
          mkdir -p github/actions/${{ github.run_id }}
          cp app/build/outputs/apk/debug/*.apk github/actions/${{ github.run_id }}/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk github/actions/${{ github.run_id }}/ 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FloatingX-APK-${{ github.run_id }}
          path: github/actions/${{ github.run_id }}/
          retention-days: 30

      - name: List build outputs
        run: |
          echo "=== Build artifacts ==="
          ls -la github/actions/${{ github.run_id }}/